server:
  port: 8082

spring:
  application:
    name: middle-roadmap
  datasource:
    url: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&TimeZone=Asia/Ho_Chi_Minh
    username: dev
    password: 1
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 60000
      connection-timeout: 30000
      idle-timeout: 600000
      minimum-idle: 10
      maximum-pool-size: 20
  sql:
    init:
      mode: always

  redis:
    host: redis
    port: 6379
    password: redis-password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://middle-roadmap-app:8090/api/user/login/oauth2/callback
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

api:
  prefix: /api

jwt:
  secret: c2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQtc2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQK
  expiration-time: 86400000

springdoc:
  api-docs:
    path: /middle-roadmap/v3/api-docs
  swagger-ui:
    path: /middle-roadmap/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"

info:
